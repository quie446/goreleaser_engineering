# CI for the self-contained release demo in release-demo/.
# - PRs: build, test and validate the goreleaser config (no secrets).
# - tags v*: run the release as a no-upload snapshot.
name: release-demo

on:
  pull_request:
    paths:
      - "release-demo/**"
      - ".github/workflows/release-demo.yml"
  push:
    paths:
      - "release-demo/**"
      - ".github/workflows/release-demo.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release-demo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build and test
        run: |
          go vet ./...
          go test ./...

      - name: Install pinned goreleaser and syft
        run: make tools

      # Bad configuration must fail the PR red.
      - name: Validate goreleaser config
        run: make release-check

      # Runs on every trigger, including tags: full cross-compile, archives,
      # checksums and SBOMs, but --snapshot never uploads anything.
      - name: Release snapshot (no upload)
        run: make release-snapshot

      - name: Show artifacts
        run: |
          ls -lh dist
          cat dist/checksums.txt

      - name: "Smoke-test --version on linux/amd64"
        run: |
          tar -xzf dist/reltool_*_linux_amd64.tar.gz -C dist reltool
          ./dist/reltool --version

      - name: "Reproducibility: two snapshots must match"
        run: make release-repro

      - name: Upload snapshot artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: reltool-snapshot
          path: release-demo/dist
          if-no-files-found: error
